packages:
  - "apps/*"
  - "packages/*"

# Expo / React Native + Metro need a flat node_modules to resolve transitive
# packages (e.g. @babel/runtime). Recommended layout for Expo in a pnpm monorepo.
nodeLinker: hoisted

# Install scripts are not needed: prebuilt binaries ship via optional deps / the
# package itself (onnxruntime-node's script only fetches GPU runtimes), and
# @scarf/scarf is telemetry.
allowBuilds:
  "@scarf/scarf": false
  "@swc/core": false
  onnxruntime-node: false
  protobufjs: false

