server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted Expo assets — cache hard.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Exported assets (images, icon fonts) carry a content hash — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        location ~* \.ttf$ {
            types { }
            default_type font/ttf;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Never cache the entry document, so deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The service worker must not be HTTP-cached, or updates won't propagate.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Crawler files: exact matches so a missing file 404s instead of falling
    # back to index.html (Search Console rejects an HTML "sitemap").
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # SPA fallback (expo-router single output).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Brotli needs a non-stock nginx module; gzip covers every text/font type.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/javascript
        application/json application/manifest+json application/ld+json image/svg+xml font/ttf;
    gzip_min_length 1024;
}
