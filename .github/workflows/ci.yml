name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typechecks the workspace package the API imports from.
      - name: Typecheck shared
        run: pnpm --filter @flowpedia/shared build

      - name: Typecheck api
        run: pnpm --filter @flowpedia/api exec tsc --noEmit -p tsconfig.json

      - name: Test
        run: pnpm -r test
